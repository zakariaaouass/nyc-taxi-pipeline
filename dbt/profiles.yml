nyc_taxi:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'nyc-taxi-pipeline-492610') }}"
      dataset: nyc_taxi_dev
      keyfile: /opt/airflow/gcp/credentials.json
      location: "{{ env_var('GCP_REGION', 'us-central1') }}"
      threads: 4
      timeout_seconds: 300
    prod:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'nyc-taxi-pipeline-492610') }}"
      dataset: nyc_taxi_prod
      keyfile: /opt/airflow/gcp/credentials.json
      location: "{{ env_var('GCP_REGION', 'us-central1') }}"
      threads: 4
      timeout_seconds: 300
