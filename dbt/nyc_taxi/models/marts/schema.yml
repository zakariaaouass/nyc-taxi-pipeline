version: 2

models:
  - name: fct_trips
    description: "Trip fact table (grain: one row per trip). Incremental, partitioned by month."
    columns:
      - name: trip_key
        tests: [unique, not_null]
      - name: pickup_date
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: pickup_location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: dropoff_location_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_id
      - name: payment_type
        tests:
          - relationships:
              to: ref('dim_payment_type')
              field: payment_type
      - name: total_amount
        tests: [not_null]

  - name: dim_location
    description: NYC TLC taxi zones
    columns:
      - name: location_id
        tests: [unique, not_null]

  - name: dim_payment_type
    description: TLC payment type codes
    columns:
      - name: payment_type
        tests: [unique, not_null]

  - name: dim_date
    description: Calendar dimension
    columns:
      - name: date_day
        tests: [unique, not_null]
