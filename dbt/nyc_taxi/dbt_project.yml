name: 'nyc_taxi'
version: '1.1.0'
config-version: 2

profile: 'nyc_taxi'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  nyc_taxi:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  nyc_taxi:
    taxi_zone_lookup:
      +column_types:
        LocationID: int64
        Borough: string
        Zone: string
        service_zone: string
    payment_types:
      +column_types:
        payment_type: int64
        payment_type_desc: string
